<!DOCTYPE html>
<html>
<head>
<title>MY BLOG - Post Detail</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
<style>
body,h1,h2,h3,h4,h5 {font-family: "Raleway", sans-serif}
.comment-section {
    margin-top: 20px;
}
.comment-list {
    margin-top: 20px;
}
.comment-item {
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
}
.image-container {
    margin-bottom: 20px;
}
</style>
</head>
<body class="w3-light-grey">

<div class="w3-content" style="max-width:1400px">

  <header class="w3-container w3-center w3-padding-32 w3-green"> 
    <h1 style="font-weight: bold; font-size: 2.5em;">
      <a href="/" style="text-decoration: none; color: white;">My Blog</a>
    </h1>
    <p style="font-size: 1.2em;">글 상세 페이지</p>
  </header>

  <div class="w3-container w3-white w3-margin w3-padding">
    <div class="image-container">
      {% if post.image_url %}
        <img src="{{ post.filtered_image_url if post.apply_filter and post.filtered_image_url else post.image_url }}" style="width:100%; max-width:600px">
      {% endif %}
    </div>
    
    <h1><b>{{ post.title }}</b></h1>
    <h5>작성일, <span class="w3-opacity">{{ post.date_str }}</span></h5>
    <p>{{ post.content }}</p>
    
    <!-- 댓글 섹션 -->
    <div class="comment-section">
      <h3>댓글</h3>
      <textarea class="w3-input w3-border" rows="4" id="comment-input" placeholder="댓글을 입력하세요"></textarea>
      <button class="w3-button w3-green w3-margin-top" onclick="submitComment({{ post.id }})">댓글 달기</button>
      
      <!-- 댓글 목록 -->
      <div class="comment-list" id="comment-list">
        {% for comment in comments %}
          <div class="comment-item">
            <p>{{ comment.content }}</p>
            <small class="w3-opacity">{{ comment.date_str }}</small>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>

  <button class="w3-button w3-red w3-margin-top" onclick="deletePost({{ post.id }})">삭제하기</button>
  <button class="w3-button w3-dark-grey w3-margin-top" onclick="window.location.href='/'">홈으로 돌아가기</button>

</div>

<script>
function deletePost(postId) {
    if (confirm("정말로 이 글을 삭제하시겠습니까?")) {
      fetch(`/delete/${postId}`, {
        method: 'DELETE',
      })
      .then(response => {
        if (response.ok) {
          alert("글이 삭제되었습니다.");
          window.location.href = '/blog';
        } else {
          alert("삭제에 실패했습니다.");
        }
      })
      .catch(error => {
        console.error('Error:', error);
        alert("오류가 발생했습니다.");
      });
    }
}

function submitComment(postId) {
    const commentInput = document.getElementById('comment-input');
    const content = commentInput.value.trim();
    
    if (content === '') {
        alert('댓글을 입력해주세요.');
        return;
    }

    fetch(`/comments/${postId}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ content: content })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            const commentList = document.getElementById('comment-list');
            const newComment = document.createElement('div');
            newComment.className = 'comment-item';
            newComment.innerHTML = `
                <p>${data.comment.content}</p>
                <small class="w3-opacity">${data.comment.date_str}</small>
            `;
            commentList.insertBefore(newComment, commentList.firstChild);
            commentInput.value = '';
            alert('댓글이 등록되었습니다.');
        } else {
            alert('댓글 등록에 실패했습니다.');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('오류가 발생했습니다.');
    });
}
</script>

</body>
</html>
