<!DOCTYPE html>
<html>
<head>
<title>MY BLOG</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
<style>
body,h1,h2,h3,h4,h5 {font-family: "Raleway", sans-serif}
.image-container { position: relative; display: inline-block; width: 100%; }
.post-image { width: 100%; }
.loading-overlay {
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 20px;
}
.header-container {
  position: relative;
}
.back-button {
  position: absolute;
  top: 10px;
  right: 10px;
}
</style>
</head>
<body class="w3-light-grey">

<div class="w3-content" style="max-width:1400px">

  <div class="header-container">
    <header class="w3-container w3-center w3-padding-32 w3-green"> 
      <h1 style="font-weight: bold; font-size: 2.5em;">My Blog</h1>
      <p style="font-size: 1.2em;">블로그에 오신 것을 환영합니다!</p>
      <button class="w3-button w3-dark-grey w3-small back-button" onclick="window.location.href='/'">처음 화면으로</button>
    </header>
  </div>

  <div class="w3-row">
    <div class="w3-col l8 s12">
      <div class="w3-card-4 w3-margin w3-white w3-padding">
        <h2>글쓰기</h2>
        <form id="write-form" enctype="multipart/form-data" method="POST" action="/create_post">
          <p><input class="w3-input w3-border" type="text" name="title" placeholder="제목" required></p>
          <p><textarea class="w3-input w3-border" name="content" rows="10" placeholder="내용" required></textarea></p>
          <p><input class="w3-input w3-border" type="file" name="image" accept="image/*"></p>
          <p><input class="w3-input w3-border" type="password" name="password" placeholder="삭제용 비밀번호 (선택)"></p>
          <button class="w3-button w3-green" type="submit">작성 완료</button>
        </form>
      </div>
    </div>
  </div>
</div>

<footer class="w3-container w3-dark-grey w3-padding-32 w3-margin-top"></footer>

<script>
document.getElementById('write-form').addEventListener('submit', function(e) {
  const imageInput = document.querySelector('input[name="image"]');
  if (imageInput.files && imageInput.files.length > 0) {
    if (!confirm("필터를 적용하시겠습니까? (흑백 필터가 적용됩니다)")) {
      e.preventDefault();
      const formData = new FormData(this);
      formData.append('apply_filter', 'false');
      fetch('/create_post', {
        method: 'POST',
        body: formData
      }).then(() => window.location.href = '/blog');
    } else {
      const formData = new FormData(this);
      formData.append('apply_filter', 'true');
      fetch('/create_post', {
        method: 'POST',
        body: formData
      }).then(() => window.location.href = '/blog');
      e.preventDefault();
    }
  }
});
</script>

</body>
</html>
