<div class="post-content">
    <h1>{{ post.title }}</h1>
    <p class="post-meta">작성자: {{ post.username }} | 작성일: {{ post.date }}</p>
    
    {% if post.image_url %}
    <img src="{{ post.image_url }}" alt="게시물 이미지" class="post-image">
    {% endif %}
    
    <div class="post-text">
        {{ post.content }}
    </div>
    
    <div class="post-actions">
        <button onclick="showDeleteForm()" class="delete-btn">삭제하기</button>
    </div>
    
    <div id="deleteForm" style="display: none;">
        <form action="{{ url_for('delete_post', post_id=post.id) }}" method="post">
            <input type="password" name="password" placeholder="삭제용 비밀번호를 입력하세요" required>
            <button type="submit">삭제</button>
        </form>
    </div>
</div>

<script>
function showDeleteForm() {
    document.getElementById('deleteForm').style.display = 'block';
}
</script>
