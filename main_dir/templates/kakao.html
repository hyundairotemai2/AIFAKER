<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Image Upload</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"/>
    <script src="https://code.jquery.com/jquery-1.8.3.min.js"></script>
    <style>
        .chat_wrap { border:1px solid #999; width:375px; padding:5px; font-size:13px; color:#333; margin: auto; }
        .chat_wrap .inner { background-color:#acc2d2; border-radius:5px; padding:10px; overflow-y:scroll; height: 600px; display: flex; flex-direction: column; align-items: center; }
        .chat_wrap .item { margin-top:15px; display: flex; width: 100%; justify-content: center; }
        .chat_wrap .item.mymsg { justify-content: flex-end; }
        .chat_wrap .item.yourmsg { justify-content: flex-start; }
        .chat_wrap .item .box { display:inline-block; max-width:250px; position:relative; text-align: left; }
        .chat_wrap .item .box .msg { background:#fff; border-radius:10px; padding:8px; word-break: break-word; }
        .chat_wrap .item.mymsg .box .msg { background:#fee600; }
        .chat_wrap .item .box .time { font-size:11px; color:#999; display: block; text-align: right; margin-top: 3px; }
        input[type="text"], input[type="file"] { width:100%; background:#ddd; border-radius:5px; height:30px; padding-left:5px; margin-top:5px }
        .chat_wrap .item .box img { max-width: 160px; border-radius: 10px; filter: grayscale(100%); }
        .logout { text-align: center; margin-top: 10px; }
        .logout a { color: #007bff; text-decoration: none; }
        .download-btn { margin-top: 5px; padding: 5px; background-color: #fee600; color: rgb(0, 0, 0); border: none; border-radius: 5px; cursor: pointer; width: 60%; text-align: center; font-size: 11px; }
        .download-btn:hover { background-color: #fee600; }
    </style>
</head>
<body>
    <div class="chat_wrap">
        <div class="inner">
            {% for msg in messages %}
            <div class="item {{ msg.sender_class }}">
                <div class="box">
                    {% if msg.type == 'text' %}
                    <p class="msg">{{ msg.content }}</p>
                    {% elif msg.type == 'image' %}
                    <img src="{{ url_for('serve_output', filename=msg.content) }}">
                    <button class="download-btn" onclick="downloadImage('{{ url_for('serve_output', filename=msg.content) }}')">다운로드</button>
                    {% endif %}
                    <span class="time">{{ msg.time }}</span>
                </div>
            </div>
            {% endfor %}
        </div>
        <input type="text" class="mymsg" placeholder="내 메시지 입력">
        <input type="text" class="yourmsg" placeholder="상대방 메시지 입력">
        <input type="file" id="imageUpload" accept="image/*">
        <div class="logout"><a href="{{ url_for('login') }}">로그아웃</a></div>
    </div>
    <script>
        $(function(){
            $(".mymsg, .yourmsg").keypress(function(e){
                if(e.keyCode == 13 && $(this).val().length){
                    let senderClass = $(this).hasClass("mymsg") ? "mymsg" : "yourmsg";
                    let content = $(this).val();
                    $.ajax({
                        url: "/send_message",
                        type: "POST",
                        data: { message: content, sender_class: senderClass },
                        success: function(response){
                            if(response.status === "success"){
                                loadMessages();
                            }
                        },
                        error: function(xhr, status, error){
                            console.log("메시지 전송 실패: " + error);
                        }
                    });
                    $(this).val('');
                }
            });

            $("#imageUpload").change(function(event){
                let file = event.target.files[0];
                if(file){
                    let formData = new FormData();
                    formData.append("file", file);
                    let useFilter = confirm("필터를 사용하시겠습니까?");
                    if(useFilter){
                        $.ajax({
                            url: "/apply_filter",
                            type: "POST",
                            data: formData,
                            processData: false,
                            contentType: false,
                            success: function(response){
                                if(response.status === "success"){
                                    loadMessages();
                                }
                            },
                            error: function(xhr, status, error){
                                console.log("이미지 업로드 실패: " + error);
                            }
                        });
                    } else {
                        let reader = new FileReader();
                        reader.onload = function(e){
                            sendMessage(e.target.result, 'image', 'mymsg');
                        }
                        reader.readAsDataURL(file);
                    }
                    $(this).val('');
                }
            });

            setInterval(loadMessages, 1000);
            loadMessages();
        });

        function sendMessage(content, type, senderClass){
            let msgContent = type === 'image' 
                ? `<img src="${content}"><button class="download-btn" onclick="downloadImage('${content}')">다운로드</button>` 
                : `<p class="msg">${content}</p>`;
            let messageHTML = `<div class="item ${senderClass}"><div class="box">${msgContent}<span class="time">${currentTime()}</span></div></div>`;
            let chatInner = $(".chat_wrap .inner");
            chatInner.append(messageHTML);
            chatInner.scrollTop(chatInner[0].scrollHeight);
        }

        function loadMessages(){
            $.get("/chat", function(data){
                $(".inner").html($(data).find(".inner").html());
                $(".chat_wrap .inner").scrollTop($(".chat_wrap .inner")[0].scrollHeight);
            }).fail(function(xhr, status, error){
                console.log("메시지 로드 실패: " + error);
            });
        }

        function currentTime(){
            let date = new Date();
            let hh = date.getHours();
            let mm = date.getMinutes();
            let apm = hh >= 12 ? "오후" : "오전";
            hh = hh % 12 || 12;
            return `${apm} ${hh}:${mm < 10 ? '0' + mm : mm}`;
        }

        function downloadImage(url) {
            let a = document.createElement('a');
            a.href = url;
            a.download = 'image.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
