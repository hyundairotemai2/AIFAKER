<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='join_chat.css') }}">
</head>
<body>
<form method="POST">
    <table>
        <tr>
            <td><h2>회원가입</h2></td>
        </tr>
        <tr><td>아이디</td></tr>
        <tr><td><input type="text" name="username" class="text" required></td></tr>
        <tr><td>비밀번호</td></tr>
        <tr><td><input type="password" name="password" class="text" required></td></tr>
        <tr><td><input type="submit" value="가입하기" class="btn"></td></tr>
        {% if error %}
        <tr>
            <td style="color: red;">{{ error }}</td>
        </tr>
        {% endif %}
    </table>
</form>
</body>
</html>
