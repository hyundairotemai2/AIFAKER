<!DOCTYPE html>
<html>
<head>
    <title>My AI Journey</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <style>
        body,h1,h2,h3,h4,h5 {font-family: "Raleway", sans-serif}
    </style>
</head>
<body class="w3-light-grey">

<div class="w3-content" style="max-width:1400px">
    <header class="w3-container w3-center w3-padding-32"> 
        <h1><b>나의 AI 블로그</b></h1>
        <p>환영합니다! <span class="w3-tag">AI 취업을 준비하는</span> 나만의 공간</p>
    </header>

    <div class="w3-card-4 w3-margin w3-white">
        <img id="aiJourneyImage" alt="AI Future" style="width:100%; display:none;">
        <div class="w3-container">
            <input type="file" id="imageUpload" accept="image/*" onchange="previewImage(event)">
        </div>
        <div class="w3-container">
            <h3><b>AI 공부 여정</b></h3>
            <h5>경험 공유, <span class="w3-opacity">2025년 3월 17일</span></h5>
        </div>
    </div>
    <hr>

    <div class="w3-card-4 w3-margin w3-white">
        <h3 class="w3-center"><b>필터 적용된 이미지</b></h3>
        <img id="filteredImage" style="width:100%; display:none;" alt="필터 적용된 이미지">
    </div>

</div>

<script>
    function previewImage(event) {
        const file = event.target.files[0];
        const imagePreview = document.getElementById('aiJourneyImage');
        
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'block';

                // 팝업 표시 후 필터 적용 요청
                setTimeout(() => {
                    const applyFilter = confirm("필터를 씌우겠습니까?");
                    if (applyFilter) {
                        applyNoiseFilter(file);
                    }
                }, 100);
            };
            reader.readAsDataURL(file);
        }
    }

    function applyNoiseFilter(file) {
        const formData = new FormData();
        formData.append("file", file);

        fetch("/apply_filter", {
            method: "POST",
            body: formData
        })
        .then(response => response.blob())
        .then(blob => {
            const url = URL.createObjectURL(blob);
            const filteredImage = document.getElementById("filteredImage");
            filteredImage.src = url;
            filteredImage.style.display = "block";
        })
        .catch(error => console.error("Error:", error));
    }
</script>

</body>
</html>
