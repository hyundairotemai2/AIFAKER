<!DOCTYPE html>
<html>
<head>
<title>글쓰기 - MY BLOG</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
<style>
body,h1,h2,h3,h4,h5 {font-family: "Raleway", sans-serif}
#preview { width: 100%; max-height: 400px; object-fit: cover; margin-top: 20px; }
</style>
</head>
<body class="w3-light-grey">

<div class="w3-content" style="max-width:1400px">

  <header class="w3-container w3-center w3-padding-32 w3-green"> 
    <h1 style="font-weight: bold; font-size: 2.5em;">글쓰기</h1>
    <p style="font-size: 1.2em;">새로운 글을 작성해보세요!</p>
  </header>

  <div class="w3-container w3-white w3-margin w3-padding">
    <form action="/create_post" method="post" enctype="multipart/form-data" id="postForm">
      <label for="title"><b>제목</b></label>
      <input class="w3-input w3-border w3-margin-bottom" type="text" id="title" name="title" required>

      <label for="content"><b>내용</b></label>
      <textarea class="w3-input w3-border" id="content" name="content" rows="10" required></textarea>

      <label for="image"><b>이미지 업로드</b></label>
      <input class="w3-input w3-border w3-margin-bottom" type="file" id="image" name="image" accept="image/*" onchange="previewImage(event)">
      <img id="preview" style="display:none;">

      <button class="w3-button w3-green w3-margin-top" type="submit">글 작성하기</button>
      <a href="/" class="w3-button w3-dark-grey w3-margin-top">취소</a>
    </form>
  </div>
</div>

<footer class="w3-container w3-dark-grey w3-padding-32 w3-margin-top">
</footer>

<script>
function previewImage(event) {
  const image = document.getElementById('image').files[0];
  if (!image) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = document.getElementById('preview');
    img.src = e.target.result;
    img.style.display = 'block';

    if (confirm('필터를 적용하시겠습니까?')) {
      applyFilter(img);
    }
  };
  reader.readAsDataURL(image);
}
function applyFilter(img) {
  // noise_model.py를 호출하여 필터 적용
  fetch('/apply_filter', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ image: img.src })
  })
  .then(response => response.json())
  .then(data => {
    img.src = data.filtered_image;
  })
  .catch(error => {
    console.error('Error:', error);
  });
}
</script>

</body>
</html>
