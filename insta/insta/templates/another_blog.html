<!DOCTYPE html>
<html>
<head>
<title>MY BLOG</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
<style>
body,h1,h2,h3,h4,h5 {font-family: "Raleway", sans-serif}
</style>
</head>
<body class="w3-light-grey">

<div class="w3-content" style="max-width:1400px">

  <header class="w3-container w3-center w3-padding-32 w3-green"> 
    <h1 style="font-weight: bold; font-size: 2.5em;">My Blog</h1>
    <p style="font-size: 1.2em;">블로그에 오신 것을 환영합니다!</p>
  </header>

  <div class="w3-row">
    <div class="w3-col l8 s12">
      <button class="w3-button w3-dark-grey w3-small w3-margin-bottom" onclick="window.location.href='/write'">글쓰기</button>
      
      {% for post in posts %}
      <div class="w3-card-4 w3-margin w3-white">
        {% if post.image_url %}
          <img src="{{ post.image_url }}" style="width:100%">
        {% endif %}
        <div class="w3-container">
          <h3><b>{{ post.title }}</b></h3>
          <h5>작성일, <span class="w3-opacity">MARCH 20, 2025</span></h5>
        </div>
        <div class="w3-container">
          <p>{{ post.content[:100] }}...</p>
          <button class="w3-button w3-padding-large w3-white w3-border" onclick="window.location.href='/post/{{ post.id }}'">
            <b>READ MORE »</b>
          </button>
        </div>
      </div>
      <hr>
      {% endfor %}
    </div>

    <div class="w3-col l4">
      <div class="w3-card w3-margin w3-margin-top">
        <img src="/static/images/shiba.jpg" style="width:100%">
        <div class="w3-container w3-white">
          <h4><b>내 소개</b></h4>
          <p>안녕하세요, 제 블로그에 오신걸 환영합니다!</p>
        </div>
      </div>

      <hr>

      <div class="w3-card w3-margin">
        <div class="w3-container w3-padding">
          <h4>태그</h4>
        </div>
        <div class="w3-container w3-white">
          <p>
            <span class="w3-tag w3-black">파이썬</span>
            <span class="w3-tag w3-light-grey">Web Programming</span>
            <span class="w3-tag w3-light-grey">게임</span>
            <span class="w3-tag w3-light-grey">축구</span>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="w3-container w3-dark-grey w3-padding-32 w3-margin-top"></footer>

</body>
</html>
