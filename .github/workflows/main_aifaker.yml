jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: "Production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Zip for deployment
        run: |
          cd main_dir
          zip -r ../app.zip * -x "__pycache__/*" "*.pyc" "antenv/*"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "AIFAKER"
          slot-name: "Production"
          package: ./app.zip
