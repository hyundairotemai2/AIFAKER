name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name aifakerregistry

      - name: Build and push Docker image to ACR
        run: |
          docker build -t aifakerregistry.azurecr.io/aifaker-app:latest ./main_dir
          docker push aifakerregistry.azurecr.io/aifaker-app:latest

      - name: Restart Azure Web App to pull latest image
        run: |
          az webapp restart \
            --name AIFAKER \
            --resource-group AIFAKER_group
