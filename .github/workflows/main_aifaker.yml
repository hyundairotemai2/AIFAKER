name: Build and deploy Python app to Azure Web App - AIFAKER

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🔻 기존 설치 단계 삭제됨

      - name: Zip artifact for deployment
        run: |
          cd main_dir
          zip -r ../release.zip * -x "__pycache__/*" "*.pyc" ".python_packages/*" "antenv/*"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "Production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./artifacts

      - name: Unzip artifact for deployment
        run: |
          mkdir -p deploy_dir
          unzip ./artifacts/release.zip -d deploy_dir

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "AIFAKER"
          slot-name: "Production"
          package: ./deploy_dir
