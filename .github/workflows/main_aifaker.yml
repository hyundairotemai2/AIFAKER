name: Build and deploy Python app to Azure Web App - AIFAKER

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up virtual environment and install dependencies
        run: |
          set -e
          cd insta/insta
          python -m venv venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/insta/insta/venv" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/insta/insta/venv/bin" >> $GITHUB_PATH
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Zip artifact for deployment
        run: |
          cd insta/insta
          zip -r ../../release.zip . -x "venv/*"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "Production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6C87D8C2788F45D2AA6E60DA085ECCCE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2B35D509F10B42729466203867A4ECAC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C2C01616FC564E38A0DD4E21677D10E3 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "AIFAKER"
          slot-name: "Production"
          package: .
